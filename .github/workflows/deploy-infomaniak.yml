name: Deploy to Infomaniak via SFTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Installer Node.js (Version 24 comme Infomaniak)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      # 3. Installer les dépendances
      - name: Install dependencies
        run: npm ci
      
      # 4. Build du projet
      - name: Build project
        run: npm run build
        env:
          CI: false 

      # 5. Installation de sshpass
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # 6. Initialisation et Déploiement
      - name: Initialize and Deploy
        run: |
          REMOTE_PATH="${{ secrets.SFTP_PATH }}"
          
          if [[ "$REMOTE_PATH" != */ ]]; then
            REMOTE_PATH="$REMOTE_PATH/"
          fi
          
          echo "🔍 Connexion à ${{ secrets.SFTP_HOST }} en tant que ${{ secrets.SFTP_USERNAME }}"
          echo "📂 Chemin cible : $REMOTE_PATH"
          
          echo "🛠️ Création/Vérification de l'arborescence distante..."
          sshpass -p '${{ secrets.SFTP_PASSWORD }}' ssh -o StrictHostKeyChecking=no ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }} "mkdir -p $REMOTE_PATH"
          
          if [ $? -ne 0 ]; then
            echo "❌ Échec de la création du dossier. Vérifiez le chemin et les permissions."
            exit 1
          fi
          echo "✅ Dossier prêt."
          
          # DÉPLOIEMENT DES FICHIERS
          echo "🚀 Envoi des fichiers depuis ./.next/ vers $REMOTE_PATH"
          
          rsync -avz --delete \
            -e "sshpass -p '${{ secrets.SFTP_PASSWORD }}' ssh -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env*' \
            ./.next/ \
            "${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }}:$REMOTE_PATH"
            
          echo "✅ Déploiement terminé avec succès !"
          echo "⚠️ Action requise : Allez sur le Manager Infomaniak et cliquez sur 'Restart' pour votre site Node.js."
