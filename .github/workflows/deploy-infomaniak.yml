name: Deploy to Infomaniak via Git Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install sshpass and openssh-client
        run: sudo apt-get update && sudo apt-get install -y sshpass openssh-client

      - name: Push Source Code to Infomaniak
        run: |
          echo "🚀 DÉBUT DU DÉPLOIEMENT"
          
          # Config Git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 1. Générer la clé
          echo "🔑 Génération de la clé..."
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q
          chmod 600 ~/.ssh/id_ed25519
          
          # 2. Préparer la connexion
          SSH_USER="${{ secrets.SFTP_USERNAME }}"
          SSH_HOST="${{ secrets.SFTP_HOST }}"
          SSH_PASS="${{ secrets.SFTP_PASSWORD }}"
          
          # 3. Déposer la clé publique MANUELLEMENT (Méthode robuste)
          echo "📡 Dépôt de la clé publique..."
          
          # On crée le dossier .ssh distant via une commande simple
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p ~/.ssh && chmod 700 ~/.ssh"
          
          # On écrit la clé publique dans le fichier authorized_keys distant
          # On utilise 'cat' depuis le local vers le distant via sshpass
          sshpass -p "$SSH_PASS" cat ~/.ssh/id_ed25519.pub | ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "cat >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys"
          
          if [ $? -ne 0 ]; then
            echo "❌ Échec du dépôt de la clé."
            exit 1
          fi
          echo "✅ Clé déposée."
          
          # 4. Attente de synchronisation
          echo "⏳ Attente (5s)..."
          sleep 5
          
          # 5. Test de connexion (CRUCIAL)
          echo "🧪 Test de connexion par clé..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o BatchMode=yes "$SSH_USER@$SSH_HOST" "echo 'SUCCÈS'"
          
          if [ $? -ne 0 ]; then
            echo "❌ Le test de connexion par clé a échoué."
            echo "Le serveur refuse la clé. Vérifiez vos droits SSH chez Infomaniak."
            exit 1
          fi
          
          # 6. Git Push
          echo "🔄 Configuration Git..."
          git config --global core.sshCommand "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no"
          
          REMOTE_REPO="ssh://${SSH_USER}@${SSH_HOST}/home/${SSH_USER}/git-depot/originenature.git"
          git remote add infomaniak "$REMOTE_REPO"
          
          echo "🚀 Push en cours..."
          git push -f infomaniak main --no-verify
          
          echo "✅ DÉPLOIEMENT RÉUSSI !"
