name: Deploy to Infomaniak via Git Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Push Source Code to Infomaniak
        run: |
          echo "🚀 DÉBUT DU DÉPLOIEMENT"
          
          # Config Git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 1. Générer la clé
          echo "🔑 Génération de la clé..."
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q
          chmod 600 ~/.ssh/id_ed25519
          
          # Encoder la clé publique en Base64 (évite tous les problèmes de caractères spéciaux)
          PUB_KEY_B64=$(base64 -w 0 ~/.ssh/id_ed25519.pub)
          
          # Variables
          SSH_USER="${{ secrets.SFTP_USERNAME }}"
          SSH_HOST="${{ secrets.SFTP_HOST }}"
          SSH_PASS="${{ secrets.SFTP_PASSWORD }}"
          
          # 2. Déposer la clé publique (Méthode Base64 robuste)
          echo "📡 Dépôt de la clé publique (via Base64)..."
          
          # Une seule commande SSH exécutée avec sshpass
          # Elle décode la clé et l'écrit dans authorized_keys
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "mkdir -p ~/.ssh && chmod 700 ~/.ssh && echo '$PUB_KEY_B64' | base64 -d >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys"
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Échec critique lors du dépôt de la clé (Code: $EXIT_CODE)."
            echo "Cela signifie que le compte SSH refuse l'exécution de commande distante."
            echo "Solution de contournement : Il faut ajouter la clé manuellement dans le Manager Infomaniak."
            exit 1
          fi
          echo "✅ Clé déposée avec succès."
          
          # 3. Attente
          echo "⏳ Attente (5s)..."
          sleep 5
          
          # 4. Test de connexion
          echo "🧪 Test de connexion par clé..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o BatchMode=yes "$SSH_USER@$SSH_HOST" "echo 'CONNEXION RÉUSSIE'"
          
          if [ $? -ne 0 ]; then
            echo "❌ Échec du test de connexion par clé."
            exit 1
          fi
          
          # 5. Git Push
          echo "🔄 Configuration Git..."
          git config --global core.sshCommand "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no"
          
          REMOTE_REPO="ssh://${SSH_USER}@${SSH_HOST}/home/${SSH_USER}/git-depot/originenature.git"
          git remote add infomaniak "$REMOTE_REPO"
          
          echo "🚀 Push en cours..."
          git push -f infomaniak main --no-verify
          
          echo "✅ DÉPLOIEMENT RÉUSSI !"
