name: Deploy to Infomaniak via Git Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour git push

      # 2. Configurer Git et Pousser vers Infomaniak
      # C'est TOUT. Infomaniak fera le reste.
      - name: Push Source Code to Infomaniak
        run: |
          # Configuration de l'utilisateur Git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Deploy"

          # Variables depuis les secrets
          SSH_USER="${{ secrets.SFTP_USERNAME }}"
          SSH_HOST="${{ secrets.SFTP_HOST }}"
          SSH_PASS="${{ secrets.SFTP_PASSWORD }}"
          
          # URL du dépôt distant (le dossier git-depot/monsite.git créé sur Infomaniak)
          REMOTE_REPO="ssh://${SSH_USER}:${SSH_PASS}@${SSH_HOST}/home/${SSH_USER}/git-depot/originenature.git"

          echo "🔄 Ajout du remote Infomaniak..."
          git remote add infomaniak "$REMOTE_REPO"

          echo "🚀 Envoi du CODE SOURCE vers Infomaniak..."
          echo "🛠️ Le serveur Infomaniak va maintenant lancer : npm install && npm run build"
          
          git push -f infomaniak main --no-verify

          echo "✅ Code envoyé avec succès !"
