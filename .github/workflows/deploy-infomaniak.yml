- name: Push Source Code to Infomaniak
        run: |
          # 1. Configuration Git de base
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Deploy"
          
          # 2. Générer une clé SSH temporaire
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -C "github-actions"
          chmod 600 ~/.ssh/id_ed25519
          
          # 3. Récupérer la clé publique générée
          PUB_KEY=$(cat ~/.ssh/id_ed25519.pub)
          
          # 4. Se connecter UNE FOIS avec le mot de passe pour déposer la clé publique
          echo "🔑 Dépôt de la clé SSH sur Infomaniak..."
          
          # Utilisation de la variable d'environnement pour éviter les problèmes de quotes dans YAML
          export SSHPASS="${{ secrets.SFTP_PASSWORD }}"
          
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }} "mkdir -p ~/.ssh && echo '${PUB_KEY}' >> ~/.ssh/authorized_keys && chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys"
          
          # 5. Configurer Git pour utiliser cette clé
          git config --global core.sshCommand "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no"
          
          # 6. Définir l'URL du dépôt (SANS mot de passe cette fois !)
          SSH_USER="${{ secrets.SFTP_USERNAME }}"
          SSH_HOST="${{ secrets.SFTP_HOST }}"
          REMOTE_REPO="ssh://${SSH_USER}@${SSH_HOST}/home/${SSH_USER}/git-depot/originenature.git"

          echo "🔄 Ajout du remote Infomaniak..."
          git remote add infomaniak "$REMOTE_REPO"

          echo "🚀 Envoi du CODE SOURCE via Clé SSH..."
          git push -f infomaniak main --no-verify

          echo "✅ Code envoyé avec succès via clé SSH !"
