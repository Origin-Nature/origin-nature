name: Deploy to Infomaniak via SFTP

on:
  push:
    branches: [ main ]  # Déclenche à chaque push sur 'main'
  workflow_dispatch:    # Permet un déclenchement manuel

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      # 3. Installer les dépendances
      - name: Install dependencies
        run: npm ci
      
      # 4. Build du projet
      - name: Build project
        run: npm run build

      # 5. Déployer via SFTP (Action corrigée)
      - name: Deploy via SFTP
        uses: easingthemes/ssh-deploy@v4.1.8
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SFTP_PASSWORD }} # Astuce : Cette action accepte aussi le mot de passe dans ce champ si pas de clé
          REMOTE_HOST: ${{ secrets.SFTP_HOST }}
          REMOTE_USER: ${{ secrets.SFTP_USERNAME }}
          REMOTE_PORT: 22
          SOURCE: "next/"
          TARGET: ${{ secrets.SFTP_PATH }}
          EXCLUDE: "/dist/, /node_modules/, /.git/, /.env"
          ARGS: "-rltgoDzvO"
