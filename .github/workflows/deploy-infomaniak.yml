- name: Push to Infomaniak Git
        run: |
          # Configurer Git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          REMOTE_URL="ssh://${{ secrets.SFTP_USERNAME }}:${{ secrets.SFTP_PASSWORD }}@${{ secrets.SFTP_HOST }}/home/${{ secrets.SFTP_USERNAME }}/git-depot/originenature.git"
          
          git remote add infomaniak $REMOTE_URL
          git push -f infomaniak main
